{% extends 'main.html' %}
{% block content %}
<h1>Home page Template</h1><hr>
<style>
    .home_container{
        display:grid;
        grid-template-columns:1fr 3fr;
    }

</style>




<div class="home_container ">
    <div>

        <h3>Browse Topics</h3>
        <hr>
        <div>
            <a href="{% url 'home' %}">All</a>
        </div>
        
        {% for t in topic %}
            <div>
                <a href="{% url 'home' %}?q={{t.name}}">{{t.name}}</a>
            </div>
        {% endfor %}

    </div>

    <div>
        <a href="{% url 'create-room' %}"> Create a room</a>
        <hr>
        {% for room in rooms%}
        <div>
            <span> @{{room.host.username}}</span>
            <h5>{{room.id}}--<a href="{% url 'room' room.id %}">{{room.name}}</a></h5>
            <small>{{ room.topic.name }}</small><br>
            <a href="{%url 'update-room' room.id%}">Edit Room</a><br>
            <a href="{% url 'delete-room' room.id %}">Delete room</a><br>
            <hr>
        </div>
    {% endfor %}
    
    </div>

</div>
{% endblock %}
