{% for room in rooms%}
        <body style="background-color:bisque;color:brown">
            <div>
                <a href="{% url 'profile-user' room.host.id %}"> @{{room.host.username}}</a>
                <h5>{{room.id}}--<a href="{% url 'room' room.id %}">{{room.name}}</a></h5>
                <small>{{ room.topic.name }}</small><br>
                {% if request.user == room.host %}
                <a href="{%url 'update-room' room.id%}">Edit Room</a><br>
                <a href="{% url 'delete-room' room.id %}">Delete room</a><br>
                {% endif %}
                <hr>
            </div>
        </body>
        
    {% endfor %}
