<h1>Activty</h1><hr>
        {% for msg in room_messages %}
        <div>
            <p><a href="{% url 'profile-user' msg.user.id %}">@{{msg.user}}</a>    {{msg.added|timesince}}</p>
            <small>Replied to "{{msg.room}}"</small><br>
            <p>{{msg}}</p>
            {% if msg.user == request.user %}
                <a href="{% url 'delete-message' msg.id %}">Delete</a>
            {% endif %}
            <hr>
        </div>
        {% endfor%}
