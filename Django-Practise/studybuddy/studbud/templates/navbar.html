<a href="/">
    <h1 style="font-size:50px;color:brown;background-color:rgb(219, 168, 138) ;">LOGO</h1>
</a><hr>
{% if request.path == '/' %}
<form method="GET" action="{% url 'home' %}">
    <input type="text" name="q" placeholder="Search Rooms"/>
</form>

<br>
{% if request.user.is_authenticated %}
    <a href="{% url 'logout' %}" font-size="50px">Logout</a>
{% else%}
<a href="{% url 'login' %}" font-size="50px">Login</a>
{% endif %}
{% endif %}
